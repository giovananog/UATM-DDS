version: '2'

services:
  # Subscribers 1 - 4
  subscriber1:
    image: ghcr.io/opendds/opendds:latest
    command: ["./model/subscriber1", "-DCPSConfigFile", "/opt/workspace/rtps.ini"]
    volumes:
      - .:/opt/workspace
    environment:
      - LD_LIBRARY_PATH=/opt/workspace/model
      - OPENDDS_RTPS_DEBUG=1
    hostname: "subscriber1"

  subscriber2:
    image: ghcr.io/opendds/opendds:latest
    command: ["./model/subscriber2", "-DCPSConfigFile", "/opt/workspace/rtps.ini"]
